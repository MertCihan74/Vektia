<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vektia — Behavioral Anti-Cheat Admin Dashboard">
    <title>Vektia — Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <!-- ═══ SIDEBAR ═══ -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="logo-icon">V</div>
                    <span class="logo-text">Vektia</span>
                    <span class="logo-badge">v0.1</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section-label">Ana Menü</div>
                <a href="index.html" class="nav-item active" data-page="dashboard">
                    <span class="nav-icon">📊</span>
                    Dashboard
                </a>
                <a href="clients.html" class="nav-item" data-page="clients">
                    <span class="nav-icon">🏢</span>
                    Müşteriler
                </a>

                <div class="nav-section-label">Sistem</div>
                <a href="settings.html" class="nav-item" data-page="settings">
                    <span class="nav-icon">⚙️</span>
                    Ayarlar
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">A</div>
                    <div class="user-details">
                        <div class="user-name" id="adminName">Admin</div>
                        <div class="user-role">Yönetici</div>
                    </div>
                    <button class="btn btn-ghost btn-sm" onclick="VektiaAPI.logout()" title="Çıkış Yap">🚪</button>
                </div>
            </div>
        </aside>

        <!-- ═══ MAIN CONTENT ═══ -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <h1 class="header-title">Dashboard</h1>
                <div class="header-actions">
                    <div class="header-status">
                        <span class="status-dot offline"></span>
                        <span class="status-label">Bağlanıyor...</span>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="page-content">
                <!-- Stats Grid -->
                <div class="stats-grid">
                    <div class="stat-card blue">
                        <div class="stat-card-header">
                            <span class="stat-label">Toplam Kullanıcı</span>
                            <div class="stat-icon blue">👥</div>
                        </div>
                        <div class="stat-value" id="totalPlayers">—</div>
                        <div class="stat-change positive">Kayıtlı kullanıcı sayısı</div>
                    </div>

                    <div class="stat-card green">
                        <div class="stat-card-header">
                            <span class="stat-label">Aktif Kullanıcı</span>
                            <div class="stat-icon green">✅</div>
                        </div>
                        <div class="stat-value" id="activePlayers">—</div>
                        <div class="stat-change positive">Temiz durumda</div>
                    </div>

                    <div class="stat-card orange">
                        <div class="stat-card-header">
                            <span class="stat-label">İşaretlenen</span>
                            <div class="stat-icon orange">⚠️</div>
                        </div>
                        <div class="stat-value" id="flaggedPlayers">—</div>
                        <div class="stat-change negative">İnceleme bekliyor</div>
                    </div>

                    <div class="stat-card red">
                        <div class="stat-card-header">
                            <span class="stat-label">Banlanan</span>
                            <div class="stat-icon red">🚫</div>
                        </div>
                        <div class="stat-value" id="bannedPlayers">—</div>
                        <div class="stat-change negative">Toplam ban</div>
                    </div>
                </div>

                <!-- Charts Row -->
                <div class="grid-3">
                    <!-- Detection Timeline -->
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">Tespit Zaman Serisi (24 Saat)</span>
                        </div>
                        <div class="card-body">
                            <div class="chart-container">
                                <canvas id="detectionChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <!-- Risk Distribution -->
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">Risk Dağılımı</span>
                        </div>
                        <div class="card-body">
                            <div class="chart-container" style="height: 240px;">
                                <canvas id="riskChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                </div>
            </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Auth guard
        if (!requireAuth()) throw new Error('Auth required');

        // Dashboard verilerini yükle
        setActiveNav('dashboard');
        loadDashboard();

        // Grafikleri oluştur
        createDetectionChart('detectionChart');
        createRiskDistributionChart('riskChart');

        // WebSocket canlı bağlantı (Opsiyonel)
        vektiaWS.connect();

        // Auto refresh
        setInterval(() => {
            loadDashboard();
        }, 300000); // 5 dakikada bir yenile
    </script>
</body>
</html>
